name: Aufräumen

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Alte Läufe, Artefakte, Caches und Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/prune.sh
